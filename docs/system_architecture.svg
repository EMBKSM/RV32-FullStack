<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 760" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748B"/>
    </marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.13"/>
    </filter>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="920" height="760" rx="10" fill="#FFFFFF"/>

  <!-- title -->
  <text x="460" y="33" text-anchor="middle" font-size="19" font-weight="700" fill="#0F172A">RV32-FullStack &#8212; SoC Data Path</text>
  <text x="460" y="52" text-anchor="middle" font-size="12" fill="#64748B">PC  &#8594;  Zynq PS (ARM Cortex-A9)  &#8594;  Zynq PL (FPGA)  &#183;  verified on XC7Z020 silicon @ 100 MHz</text>

  <!-- ===== Host PC ===== -->
  <rect x="260" y="70" width="400" height="74" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5" filter="url(#sh)"/>
  <text x="460" y="96" text-anchor="middle" font-size="15" font-weight="700" fill="#1D4ED8">Host PC</text>
  <text x="460" y="116" text-anchor="middle" font-size="12.5" fill="#1E293B">rv32_gui.py (PySide6)  &#183;  rv32_console.py (CLI)</text>
  <text x="460" y="133" text-anchor="middle" font-size="11" fill="#475569">assembler  &#183;  UART console  &#183;  live register read-back</text>

  <!-- arrow PC -> PS -->
  <line x1="460" y1="144" x2="460" y2="186" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="474" y="169" font-size="11.5" fill="#475569">USB-UART  &#183;  115200 8N1</text>

  <!-- ===== Zynq PS ===== -->
  <rect x="220" y="188" width="480" height="76" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5" filter="url(#sh)"/>
  <text x="460" y="214" text-anchor="middle" font-size="15" font-weight="700" fill="#15803D">Zynq PS &#8212; ARM Cortex-A9  (bare-metal)</text>
  <text x="460" y="234" text-anchor="middle" font-size="12.5" fill="#1E293B">rv32_monitor.c  &#183;  UART command parser  &#8594;  AXI-Lite driver</text>
  <text x="460" y="251" text-anchor="middle" font-size="11" fill="#475569">no DDR &#8212; RV32 driven entirely over JTAG &#8594; PS-AXI</text>

  <!-- arrow PS -> PL -->
  <line x1="460" y1="264" x2="460" y2="312" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="474" y="292" font-size="11.5" fill="#475569">AXI4-Lite  &#183;  M_AXI_GP0 @ 0x4000_0000</text>

  <!-- ===== Zynq PL container ===== -->
  <rect x="40" y="314" width="840" height="428" rx="12" fill="#F8FAFC" stroke="#475569" stroke-width="1.6" stroke-dasharray="6 4"/>
  <rect x="40" y="314" width="300" height="26" rx="12" fill="#475569"/>
  <text x="56" y="332" font-size="12.5" font-weight="700" fill="#FFFFFF">Zynq PL  =  rv32_platform  (Vivado IP)</text>

  <!-- ctrl_axi -->
  <rect x="255" y="352" width="410" height="52" rx="9" fill="#E0E7FF" stroke="#6366F1" stroke-width="1.4" filter="url(#sh)"/>
  <text x="460" y="374" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4338CA">rv32_ctrl_axi &#8212; AXI-Lite control slave</text>
  <text x="460" y="392" text-anchor="middle" font-size="11" fill="#475569">load imem/dmem  &#183;  run / step / reset  &#183;  read regs / PC / commit</text>

  <!-- arrow ctrl -> core -->
  <line x1="460" y1="404" x2="460" y2="422" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- RV32 core -->
  <rect x="255" y="424" width="410" height="56" rx="9" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.6" filter="url(#sh)"/>
  <text x="460" y="447" text-anchor="middle" font-size="13.5" font-weight="700" fill="#6D28D9">RV32I core &#8212; 5-stage pipeline</text>
  <text x="460" y="466" text-anchor="middle" font-size="11" fill="#475569">pc &#183; icache &#183; id &#183; ex &#183; mem &#183; wb   |   Zicsr &#183; trap &#183; FENCE.I &#183; I$/D$ &#183; AXI4 master</text>

  <!-- arrow core -> bridge -->
  <line x1="460" y1="480" x2="460" y2="502" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="474" y="495" font-size="11" fill="#475569">data bus (load / store)</text>

  <!-- mmio_bridge bar -->
  <rect x="95" y="504" width="730" height="30" rx="8" fill="#E2E8F0" stroke="#64748B" stroke-width="1.3"/>
  <text x="460" y="524" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">mmio_bridge   &#183;   core load/store bus  &#8594;  memory-mapped slaves</text>

  <!-- fan-out arrows -->
  <line x1="185" y1="534" x2="185" y2="568" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="460" y1="534" x2="460" y2="568" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="735" y1="534" x2="735" y2="568" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Pmod -->
  <rect x="70" y="570" width="230" height="74" rx="9" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5" filter="url(#sh)"/>
  <text x="185" y="592" text-anchor="middle" font-size="13" font-weight="700" fill="#B45309">Pmod MMIO</text>
  <text x="185" y="610" text-anchor="middle" font-size="11" font-family="'Consolas','SF Mono',monospace" fill="#92400E">0x1xxx_xxxx</text>
  <text x="185" y="629" text-anchor="middle" font-size="10.5" fill="#475569">2&#215;SPI &#183; 2&#215;I2C &#183; UART &#183; PWM &#183; GPIO</text>

  <!-- NPU -->
  <rect x="345" y="570" width="230" height="74" rx="9" fill="#CFFAFE" stroke="#0891B2" stroke-width="1.5" filter="url(#sh)"/>
  <text x="460" y="592" text-anchor="middle" font-size="13" font-weight="700" fill="#0E7490">NPU &#8212; 16&#215;16 INT8</text>
  <text x="460" y="610" text-anchor="middle" font-size="11" font-family="'Consolas','SF Mono',monospace" fill="#155E75">0x3xxx_xxxx</text>
  <text x="460" y="629" text-anchor="middle" font-size="10.5" fill="#475569">systolic GEMM &#183; 256 PE array</text>

  <!-- GPU -->
  <rect x="620" y="570" width="230" height="74" rx="9" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5" filter="url(#sh)"/>
  <text x="735" y="592" text-anchor="middle" font-size="13" font-weight="700" fill="#B91C1C">GPU &#8212; 8-lane SIMT</text>
  <text x="735" y="610" text-anchor="middle" font-size="11" font-family="'Consolas','SF Mono',monospace" fill="#991B1B">0x4xxx_xxxx</text>
  <text x="735" y="629" text-anchor="middle" font-size="10.5" fill="#475569">vector ISA &#183; BRAM scratchpad</text>

  <!-- shared-DSP connectors NPU/GPU -> unified -->
  <line x1="460" y1="644" x2="460" y2="672" stroke="#CA8A04" stroke-width="1.8" stroke-dasharray="4 3"/>
  <line x1="735" y1="644" x2="735" y2="672" stroke="#CA8A04" stroke-width="1.8" stroke-dasharray="4 3"/>
  <text x="597" y="662" text-anchor="middle" font-size="10" font-style="italic" fill="#A16207">time-shared DSP48E1</text>

  <!-- Unified fabric callout -->
  <rect x="345" y="672" width="505" height="60" rx="9" fill="#FEF08A" stroke="#CA8A04" stroke-width="2" filter="url(#sh)"/>
  <text x="597" y="694" text-anchor="middle" font-size="12.5" font-weight="700" fill="#854D0E">&#9889;  UNIFIED FABRIC &#8212; 8 dual-mode PEs, one DSP48E1 each</text>
  <text x="597" y="711" text-anchor="middle" font-size="11" fill="#713F12">NPU INT8 MAC (A&#183;B+P)   &#8646;   GPU lane MAC (A&#183;B+C)</text>
  <text x="597" y="727" text-anchor="middle" font-size="11" font-weight="600" fill="#713F12">GPU borrows 8 NPU DSPs  &#8594;  0 extra DSP  &#8594;  202/220 (92%)</text>
</svg>
