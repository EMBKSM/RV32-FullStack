<svg viewBox="0 0 1520 1080" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="1520" height="1080" fill="#ffffff"/>

  <!-- Title -->
  <text x="760" y="38" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a">RV32-FullStack — RISC-V Soft-Core SoC + INT8 NPU</text>
  <text x="760" y="64" text-anchor="middle" font-size="16" fill="#475569">Zynq XC7Z020-CLG400 · Zybo Z7-20 · PS-host-controlled · PL @ 50 MHz (16×16 NPU demo: 30.3 MHz)</text>

  <!-- Host PC -->
  <rect x="40" y="92" width="300" height="58" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="190" y="118" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Host PC</text>
  <text x="190" y="138" text-anchor="middle" font-size="12.5" fill="#475569">rv32_gui.py · serial console · JTAG</text>
  <line x1="190" y1="150" x2="190" y2="205" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="205" y="180" font-size="11.5" fill="#64748b">UART / USB-JTAG</text>

  <!-- ===================== Zynq chip container ===================== -->
  <rect x="20" y="205" width="1480" height="760" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="42" y="232" font-size="16" font-weight="700" fill="#334155">Zynq XC7Z020 (Zybo Z7-20)</text>

  <!-- PS section -->
  <rect x="44" y="250" width="350" height="690" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="219" y="276" text-anchor="middle" font-size="16" font-weight="700" fill="#1e40af">PROCESSING SYSTEM</text>
  <text x="219" y="296" text-anchor="middle" font-size="13" fill="#1d4ed8">Cortex-A9 (PS)</text>

  <rect x="66" y="312" width="306" height="62" rx="7" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="219" y="336" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">rv32_monitor (firmware)</text>
  <text x="219" y="356" text-anchor="middle" font-size="11.5" fill="#475569">loads RV32 programs · drives AXI</text>

  <rect x="66" y="386" width="146" height="56" rx="7" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="139" y="410" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1e293b">DDR3</text>
  <text x="139" y="428" text-anchor="middle" font-size="11" fill="#475569">1 GB</text>

  <rect x="226" y="386" width="146" height="56" rx="7" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="299" y="406" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">QSPI Flash</text>
  <text x="299" y="424" text-anchor="middle" font-size="11" fill="#475569">BOOT.bin (FSBL+bit+fw)</text>

  <rect x="66" y="456" width="306" height="52" rx="7" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="219" y="487" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">PS UART  ⟷  Host PC</text>

  <rect x="66" y="556" width="306" height="60" rx="7" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="219" y="580" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">M_AXI_GP0</text>
  <text x="219" y="600" text-anchor="middle" font-size="11.5" fill="#1e40af">PS → PL control bus</text>

  <!-- AXI arrow PS -> PL -->
  <line x1="372" y1="586" x2="470" y2="586" stroke="#475569" stroke-width="2.2" marker-end="url(#arr)"/>

  <!-- PL section -->
  <rect x="420" y="250" width="1056" height="690" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="700" y="276" text-anchor="middle" font-size="16" font-weight="700" fill="#15803d">PROGRAMMABLE LOGIC — rv32_platform (PL)</text>

  <!-- AXI smartconnect + ctrl slave -->
  <rect x="442" y="556" width="120" height="60" rx="7" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3"/>
  <text x="502" y="580" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">AXI Smart</text>
  <text x="502" y="597" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">Connect</text>

  <rect x="442" y="300" width="120" height="62" rx="7" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3"/>
  <text x="502" y="324" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">rv32_ctrl_axi</text>
  <text x="502" y="343" text-anchor="middle" font-size="11" fill="#15803d">S_AXI slave</text>
  <line x1="502" y1="556" x2="502" y2="364" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- RV32 core -->
  <rect x="586" y="300" width="430" height="120" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.8"/>
  <text x="801" y="324" text-anchor="middle" font-size="15" font-weight="700" fill="#854d0e">RV32I CPU — 5-stage pipeline</text>
  <g font-size="12.5" font-weight="600" fill="#713f12">
    <rect x="600" y="338" width="74" height="62" rx="6" fill="#fffbeb" stroke="#ca8a04"/>
    <text x="637" y="365" text-anchor="middle">IF</text><text x="637" y="384" text-anchor="middle" font-size="10" font-weight="400">fetch</text>
    <rect x="682" y="338" width="74" height="62" rx="6" fill="#fffbeb" stroke="#ca8a04"/>
    <text x="719" y="365" text-anchor="middle">ID</text><text x="719" y="384" text-anchor="middle" font-size="10" font-weight="400">decode</text>
    <rect x="764" y="338" width="74" height="62" rx="6" fill="#fffbeb" stroke="#ca8a04"/>
    <text x="801" y="365" text-anchor="middle">EX</text><text x="801" y="384" text-anchor="middle" font-size="10" font-weight="400">ALU</text>
    <rect x="846" y="338" width="74" height="62" rx="6" fill="#fffbeb" stroke="#ca8a04"/>
    <text x="883" y="365" text-anchor="middle">MEM</text><text x="883" y="384" text-anchor="middle" font-size="10" font-weight="400">load/store</text>
    <rect x="928" y="338" width="74" height="62" rx="6" fill="#fffbeb" stroke="#ca8a04"/>
    <text x="965" y="365" text-anchor="middle">WB</text><text x="965" y="384" text-anchor="middle" font-size="10" font-weight="400">write-back</text>
  </g>

  <!-- caches -->
  <rect x="586" y="440" width="205" height="60" rx="7" fill="#f5d0fe" stroke="#a21caf" stroke-width="1.5"/>
  <text x="688" y="464" text-anchor="middle" font-size="13.5" font-weight="600" fill="#701a75">I-Cache</text>
  <text x="688" y="484" text-anchor="middle" font-size="11" fill="#86198f">LUTRAM (distributed)</text>
  <rect x="811" y="440" width="205" height="60" rx="7" fill="#f5d0fe" stroke="#a21caf" stroke-width="1.5"/>
  <text x="913" y="464" text-anchor="middle" font-size="13.5" font-weight="600" fill="#701a75">D-Cache</text>
  <text x="913" y="484" text-anchor="middle" font-size="11" fill="#86198f">LUTRAM (distributed)</text>
  <line x1="688" y1="420" x2="688" y2="440" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="913" y1="420" x2="913" y2="440" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- mmio bridge -->
  <rect x="586" y="520" width="430" height="64" rx="7" fill="#ffedd5" stroke="#ea580c" stroke-width="1.8"/>
  <text x="801" y="545" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">mmio_bridge — data-bus splitter</text>
  <text x="801" y="566" text-anchor="middle" font-size="11.5" fill="#c2410c">cached RAM (D$)  |  MMIO 0x1xxx_xxxx  |  NPU 0x3xxx_xxxx</text>
  <line x1="913" y1="500" x2="913" y2="520" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- peripherals -->
  <rect x="586" y="606" width="430" height="118" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="801" y="629" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">MMIO Peripherals  (uncached @ 0x1)</text>
  <g font-size="11.5" fill="#334155" font-weight="600">
    <text x="610" y="652">• SYS: LED / SW / BTN</text>
    <text x="610" y="673">• GPIO (22-pin)</text>
    <text x="610" y="694">• 2× SPI master</text>
    <text x="820" y="652">• 2× I2C master</text>
    <text x="820" y="673">• UART-lite</text>
    <text x="820" y="694">• 4-ch PWM</text>
  </g>
  <text x="801" y="715" text-anchor="middle" font-size="11" fill="#64748b">→ Pmod JA · JB · JC · JD · JE</text>
  <line x1="688" y1="584" x2="688" y2="606" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Pmod connectors -->
  <g font-size="11" font-weight="700" fill="#475569">
    <rect x="606" y="752" width="62" height="34" rx="5" fill="#e2e8f0" stroke="#64748b"/><text x="637" y="774" text-anchor="middle">JA</text>
    <rect x="676" y="752" width="62" height="34" rx="5" fill="#e2e8f0" stroke="#64748b"/><text x="707" y="774" text-anchor="middle">JB</text>
    <rect x="746" y="752" width="62" height="34" rx="5" fill="#e2e8f0" stroke="#64748b"/><text x="777" y="774" text-anchor="middle">JC</text>
    <rect x="816" y="752" width="62" height="34" rx="5" fill="#e2e8f0" stroke="#64748b"/><text x="847" y="774" text-anchor="middle">JD</text>
    <rect x="886" y="752" width="62" height="34" rx="5" fill="#e2e8f0" stroke="#64748b"/><text x="917" y="774" text-anchor="middle">JE</text>
  </g>
  <line x1="801" y1="724" x2="801" y2="752" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- ===================== NPU (the star) ===================== -->
  <rect x="1042" y="300" width="412" height="488" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2.4"/>
  <text x="1248" y="326" text-anchor="middle" font-size="16" font-weight="800" fill="#991b1b">NPU  @ 0x3000_0000</text>
  <text x="1248" y="346" text-anchor="middle" font-size="12.5" fill="#b91c1c">INT8 · 16×16 output-stationary systolic GEMM</text>

  <!-- NPU MMIO regs -->
  <rect x="1062" y="360" width="372" height="52" rx="7" fill="#fff1f2" stroke="#e11d48" stroke-width="1.3"/>
  <text x="1248" y="380" text-anchor="middle" font-size="12.5" font-weight="600" fill="#9f1239">MMIO regs: CTRL · STATUS · K_DIM · CFG(requant)</text>
  <text x="1248" y="400" text-anchor="middle" font-size="11.5" fill="#be123c">A_BUF · B_BUF · C_BUF</text>

  <!-- scratchpads -->
  <rect x="1062" y="424" width="180" height="56" rx="7" fill="#fff1f2" stroke="#e11d48" stroke-width="1.3"/>
  <text x="1152" y="447" text-anchor="middle" font-size="12.5" font-weight="600" fill="#9f1239">A scratchpad</text>
  <text x="1152" y="466" text-anchor="middle" font-size="10.5" fill="#be123c">16×64 · LUTRAM</text>
  <rect x="1254" y="424" width="180" height="56" rx="7" fill="#fff1f2" stroke="#e11d48" stroke-width="1.3"/>
  <text x="1344" y="447" text-anchor="middle" font-size="12.5" font-weight="600" fill="#9f1239">B scratchpad</text>
  <text x="1344" y="466" text-anchor="middle" font-size="10.5" fill="#be123c">16×64 · LUTRAM</text>

  <!-- skew feeder -->
  <rect x="1062" y="492" width="372" height="40" rx="7" fill="#fecaca" stroke="#dc2626" stroke-width="1.3"/>
  <text x="1248" y="517" text-anchor="middle" font-size="12.5" font-weight="600" fill="#991b1b">skew feeder (diagonal A/B streaming)</text>
  <line x1="1152" y1="480" x2="1152" y2="492" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arrR)"/>
  <line x1="1344" y1="480" x2="1344" y2="492" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arrR)"/>

  <!-- PE array -->
  <rect x="1062" y="544" width="372" height="150" rx="7" fill="#fecaca" stroke="#dc2626" stroke-width="1.6"/>
  <text x="1248" y="566" text-anchor="middle" font-size="13.5" font-weight="700" fill="#991b1b">16×16 PE array — 256 INT8 MACs</text>
  <!-- mini grid -->
  <g fill="#ef4444" opacity="0.85">
    <!-- draw an 8x4 mini grid as a visual cue -->
    <g>
      <rect x="1095" y="578" width="13" height="13" rx="2"/><rect x="1112" y="578" width="13" height="13" rx="2"/><rect x="1129" y="578" width="13" height="13" rx="2"/><rect x="1146" y="578" width="13" height="13" rx="2"/><rect x="1163" y="578" width="13" height="13" rx="2"/><rect x="1180" y="578" width="13" height="13" rx="2"/><rect x="1197" y="578" width="13" height="13" rx="2"/><rect x="1214" y="578" width="13" height="13" rx="2"/>
      <rect x="1095" y="595" width="13" height="13" rx="2"/><rect x="1112" y="595" width="13" height="13" rx="2"/><rect x="1129" y="595" width="13" height="13" rx="2"/><rect x="1146" y="595" width="13" height="13" rx="2"/><rect x="1163" y="595" width="13" height="13" rx="2"/><rect x="1180" y="595" width="13" height="13" rx="2"/><rect x="1197" y="595" width="13" height="13" rx="2"/><rect x="1214" y="595" width="13" height="13" rx="2"/>
      <rect x="1095" y="612" width="13" height="13" rx="2"/><rect x="1112" y="612" width="13" height="13" rx="2"/><rect x="1129" y="612" width="13" height="13" rx="2"/><rect x="1146" y="612" width="13" height="13" rx="2"/><rect x="1163" y="612" width="13" height="13" rx="2"/><rect x="1180" y="612" width="13" height="13" rx="2"/><rect x="1197" y="612" width="13" height="13" rx="2"/><rect x="1214" y="612" width="13" height="13" rx="2"/>
    </g>
  </g>
  <text x="1330" y="600" text-anchor="middle" font-size="11.5" font-weight="600" fill="#991b1b">each PE =</text>
  <text x="1330" y="618" text-anchor="middle" font-size="11.5" font-weight="600" fill="#991b1b">DSP48E1 or</text>
  <text x="1330" y="636" text-anchor="middle" font-size="11.5" font-weight="600" fill="#991b1b">LUT MAC</text>
  <text x="1248" y="664" text-anchor="middle" font-size="11.5" fill="#b91c1c">202 DSP48E1 + 54 LUT-MAC  (DSP_BUDGET hybrid)</text>
  <text x="1248" y="683" text-anchor="middle" font-size="11" fill="#be123c">output-stationary · K accumulation (≤64)</text>

  <!-- requant -->
  <rect x="1062" y="706" width="372" height="42" rx="7" fill="#fff1f2" stroke="#e11d48" stroke-width="1.3"/>
  <text x="1248" y="731" text-anchor="middle" font-size="12.5" font-weight="600" fill="#9f1239">requantize: INT32 → ×mult → &gt;&gt;shift → clip INT8</text>
  <line x1="1248" y1="694" x2="1248" y2="706" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arrR)"/>

  <!-- NPU connection to bridge -->
  <line x1="1016" y1="552" x2="1042" y2="552" stroke="#dc2626" stroke-width="2.4" marker-end="url(#arrR)"/>
  <text x="1029" y="544" text-anchor="middle" font-size="10.5" font-weight="700" fill="#dc2626">0x3</text>

  <!-- ===================== Resource / timing band ===================== -->
  <rect x="44" y="978" width="1432" height="84" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="60" y="1004" font-size="14" font-weight="700" fill="#334155">Resources (full SoC, 16×16):</text>
  <text x="290" y="1004" font-size="13.5" fill="#1e293b">DSP 202 / 220 (92%)  ·  LUT ≈ 14.4k / 53.2k (27%)  ·  FF ≈ 8.7k (8%)  ·  BRAM 12 / 140</text>
  <text x="60" y="1030" font-size="14" font-weight="700" fill="#334155">Verification:</text>
  <text x="180" y="1030" font-size="13.5" fill="#1e293b">RTL sim 18,688 checks / 0 err  ·  ISS golden regression  ·  full-SoC RTL sim (driver+bridge+NPU)</text>
  <text x="60" y="1052" font-size="14" font-weight="700" fill="#334155">Timing:</text>
  <text x="180" y="1052" font-size="13.5" fill="#1e293b">8×8 @ 50 MHz met  ·  16×16 @ 50 MHz WNS −6.74 ns (hold met) → board demo @ <tspan font-weight="700" fill="#b91c1c">30.3 MHz</tspan> (critical path 26.7 ns)</text>

  <!-- Legend -->
  <g font-size="12" fill="#475569">
    <line x1="1095" y1="998" x2="1135" y2="998" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
    <text x="1142" y="1002">control / data path</text>
    <line x1="1095" y1="1024" x2="1135" y2="1024" stroke="#dc2626" stroke-width="2.4" marker-end="url(#arrR)"/>
    <text x="1142" y="1028">NPU GEMM dataflow</text>
  </g>
</svg>
